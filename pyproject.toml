[project]
name = "supply-control-tower"
version = "0.1.0"
description = "Supply chain analytics with tested service metrics, forecasting and anomaly detection"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb>=1.2,<2", "dbt-duckdb>=1.9,<1.10", "dbt-postgres>=1.9,<1.10", "psycopg[binary]>=3.2,<4", "pyarrow>=18,<23", "pydantic>=2.10,<3", "pandas>=2.2,<3", "statsmodels>=0.14,<0.15"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "httpx>=0.28,<1", "pyyaml>=6,<7", "jsonschema>=4,<5"]
cloud = ["boto3>=1.35,<2", "redshift-connector>=2.1,<3", "dbt-redshift>=1.9,<1.10"]
[project.scripts]
tower = "control_tower.cli:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
