AWSTemplateFormatVersion: '2010-09-09'
Description: Opt-in S3/Glue/Athena resources for the supply chain portfolio. Does not provision Redshift.
Parameters:
  ScriptBucket:
    Type: String
    Description: Existing private bucket holding the Glue script.
  ScriptKey:
    Type: String
    Default: scripts/curate.py
Resources:
  Lake:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: glue.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: TowerLakeObjects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${Lake.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Lake.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ScriptBucket}/${ScriptKey}'
  CurateJob:
    Type: AWS::Glue::Job
    Properties:
      Role: !GetAtt GlueRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 30
      MaxRetries: 0
      ExecutionProperty: {MaxConcurrentRuns: 1}
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ScriptBucket}/${ScriptKey}'
      DefaultArguments:
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--job-bookmark-option': job-bookmark-disable
        '--BUCKET': !Ref Lake
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${AWS::StackName}-exploration'
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${Lake}/athena-results/'
          EncryptionConfiguration: {EncryptionOption: SSE_S3}
Outputs:
  Bucket: {Value: !Ref Lake}
  GlueJob: {Value: !Ref CurateJob}
  AthenaWorkgroup: {Value: !Ref AthenaWorkgroup}
